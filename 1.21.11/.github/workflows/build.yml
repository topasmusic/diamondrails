name: Build

on:
  push:
    branches: [ "1.21.x" ]
  pull_request:
    branches: [ "1.21.x" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: diamondrails-jars
          path: build/libs/*.jar
          if-no-files-found: error
